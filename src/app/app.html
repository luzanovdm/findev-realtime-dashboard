<tui-root>
  <div class="shell">
    <header class="header">
      <a class="brand" routerLink="/dashboard">Findev <span>Realtime dashboard</span></a>
      <span tuiBadge appearance="neutral">Scaffold</span>
    </header>
    <nav class="navigation" aria-label="Main navigation">
      <a
        tuiButton
        size="s"
        appearance="flat"
        routerLink="/dashboard"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        iconStart="@tui.layout-dashboard"
        >Dashboard</a
      >
      <a
        tuiButton
        size="s"
        appearance="flat"
        routerLink="/settings"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        iconStart="@tui.settings"
        >Settings</a
      >
    </nav>
    @if (startupError(); as error) {
      <div class="startup-error" role="alert" aria-live="assertive">
        <p>{{ error.message }}</p>
        @if (error.recoveryAction !== 'none') {
          <button tuiButton type="button" size="s" (click)="retryInitialization()">
            Retry initialization
          </button>
        }
      </div>
    }
    <main id="main-content"><router-outlet /></main>
  </div>
</tui-root>
