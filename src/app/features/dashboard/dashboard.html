<div class="dashboard-heading">
  <div>
    <h1>Dashboard</h1>
    <p class="page-description">Live market metrics for the current run.</p>
  </div>
  <button
    tuiButton
    type="button"
    [disabled]="!dashboard.canToggle()"
    (click)="dashboard.toggleGeneration()"
  >
    {{ dashboard.presentation().controlLabel }}
  </button>
</div>

<p class="producer-status" role="status" aria-live="polite">
  {{ dashboard.presentation().message }}
  @if (dashboard.stale()) {
    Last confirmed values are outdated.
  }
  @if (dashboard.slow()) {
    Updates are arriving more slowly than the requested interval.
  }
</p>

<app-instrument-table [metrics]="dashboard.metrics()" />
