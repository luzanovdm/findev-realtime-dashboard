<div class="dashboard-heading">
  <div>
    <h1>Dashboard</h1>
    <p class="page-description">Live market metrics for the current run.</p>
  </div>
  <button
    tuiButton
    type="button"
    [disabled]="!producer.canPause() && !producer.canResume()"
    (click)="toggleGeneration()"
  >
    {{ presentation().controlLabel }}
  </button>
</div>

<p class="producer-status" role="status" aria-live="polite">
  {{ presentation().message }}
  @if (producer.stale()) {
    Last confirmed values are outdated.
  }
  @if (producer.slow()) {
    Updates are arriving more slowly than the requested interval.
  }
</p>

<app-instrument-table [metrics]="producer.metrics()" />
